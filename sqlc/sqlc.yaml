version: "2"
sql:
  - schema: "../migrations"
    queries: "./queries"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "../internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_all_enum_values: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "pg_catalog.timestamp with time zone"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamp without time zone"
            go_type: "time.Time"