# golangci-lint, run in CI and by `make lint`. go vet runs on its own
# (`make vet`), so it isn't repeated here.
version: "2"

run:
  # The integration and end-to-end tests are code too.
  build-tags: [integration, e2e]

linters:
  default: none
  enable:
    - errcheck
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      # Letting go of something that was only read, or of a connection: if
      # that fails there is nothing to do and no one to tell. A file or a
      # stream that was written is still checked, since closing it can be
      # where the write fails.
      exclude-functions:
        - (io.Closer).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (*net/smtp.Client).Close
        - (*compress/gzip.Reader).Close
        - (*database/sql.DB).Close
        - (*github.com/jackc/pgx/v5.Conn).Close
        - (*github.com/gorilla/websocket.Conn).Close
    staticcheck:
      checks:
        - all
        # golangci-lint's own defaults leave these out: a comment on every
        # package and exported name, initialisms in names, and receiver
        # names. This code doesn't follow them.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # De Morgan's law: !(a || b) often says what is meant better than
        # its expansion.
        - -QF1001

issues:
  # Everything, every time: there is no backlog of excused findings.
  max-issues-per-linter: 0
  max-same-issues: 0
