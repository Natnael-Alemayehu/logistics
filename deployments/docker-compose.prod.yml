# Production: the app, PostGIS and Caddy (automatic HTTPS for DOMAIN).
#
#   cp .env.example .env    # then set DOMAIN, DB_PASSWORD, SMS_* ...
#   docker compose -f deployments/docker-compose.prod.yml --env-file .env up -d
#
# Add `--profile monitoring` for Prometheus and Grafana. Provider keys (the
# telebirr key files) go in deployments/secrets/, seen by the app at
# /run/secrets. deployments/staging/ runs this same file, with the provider
# sandbox in place of the providers.
#
# Each container runs with the least it needs: no privilege escalation, no
# Linux capabilities beyond binding ports 80 and 443, and a read-only root
# filesystem where the program writes only to its volumes. Logs rotate.
name: kiflet

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  app:
    build:
      context: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      # The password is passed on its own, so it may contain any character.
      DATABASE_URL: postgres://logistics@postgres:5432/logistics?sslmode=disable
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN}
      ENVIRONMENT: production
      TRUST_PROXY: "true"
    volumes:
      - app-data:/data
      - ./secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # The app gives requests in progress and the text or email being sent
    # 30 seconds to finish.
    stop_grace_period: 45s
    # More than one instance shares the work: Caddy spreads requests by
    # client address, and live updates pass between them through Postgres.
    deploy:
      replicas: ${APP_REPLICAS:-1}
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgis/postgis:15-3.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: logistics
    # With WAL_ARCHIVE=on, every change is kept as it is made, in the
    # wal-archive volume, compressed: scripts/ship-wal.sh takes it off the
    # machine, and with a base backup it restores the database to any
    # moment (docs/deploy.md, "To the minute"). A segment is closed at
    # least every WAL_ARCHIVE_TIMEOUT seconds when there are changes.
    command:
      - postgres
      - -c
      - archive_mode=${WAL_ARCHIVE:-off}
      - -c
      - archive_command=[ -f /wal-archive/%f.gz ] || { gzip -c %p > /wal-archive/%f.gz.part && mv /wal-archive/%f.gz.part /wal-archive/%f.gz; }
      - -c
      - archive_timeout=${WAL_ARCHIVE_TIMEOUT:-300}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - wal-archive:/wal-archive
    # Docker's 64 MB is too little for parallel queries.
    shm_size: 256m
    security_opt: [no-new-privileges:true]
    # Time for the shutdown checkpoint, so the next start needs no recovery.
    stop_grace_period: 60s
    logging: *logging
    depends_on:
      wal-archive:
        condition: service_completed_successfully
    healthcheck:
      # Over TCP: on first start the image's set-up server answers on the
      # socket only, and the app connects over the network.
      test: ["CMD-SHELL", "pg_isready -U logistics -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10


  # Gives the WAL archive's volume to the database's user, once: a new
  # volume belongs to root.
  wal-archive:
    image: postgis/postgis:15-3.3-alpine
    entrypoint: ["sh", "-c", "chown postgres:postgres /wal-archive && chmod 700 /wal-archive"]
    volumes:
      - wal-archive:/wal-archive
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    logging: *logging
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging: *logging
    depends_on:
      - app

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    profiles: [monitoring]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # The same value as METRICS_TOKEN, on one line.
      - ./prometheus/metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus-data:/prometheus
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging

  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # The alert rules (grafana/provisioning/alerting) email this address,
      # through the app's mail server.
      GRAFANA_ALERT_EMAIL: ${GRAFANA_ALERT_EMAIL:?set GRAFANA_ALERT_EMAIL}
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${SMTP_ADDR:-}
      GF_SMTP_USER: ${SMTP_USERNAME:-}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_ALERT_FROM:?set GRAFANA_ALERT_FROM}
      GF_SMTP_FROM_NAME: Kiflet monitoring
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      # The Prometheus data source, the Kiflet dashboard and its alerts.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
    depends_on:
      - prometheus

volumes:
  app-data:
  postgres-data:
  wal-archive:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
