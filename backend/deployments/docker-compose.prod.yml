# Production: the app, PostGIS and Caddy (automatic HTTPS for DOMAIN).
#
#   cp .env.example .env    # then set DOMAIN, DB_PASSWORD, SMS_* ...
#   docker compose -f deployments/docker-compose.prod.yml --env-file .env up -d
#
# Add `--profile monitoring` for Prometheus and Grafana.
services:
  app:
    build:
      context: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://logistics:${DB_PASSWORD:?set DB_PASSWORD}@postgres:5432/logistics?sslmode=disable
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN}
      ENVIRONMENT: production
      TRUST_PROXY: "true"
    volumes:
      - app-data:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgis/postgis:15-3.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: logistics
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    profiles: [monitoring]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # The same value as METRICS_TOKEN, on one line.
      - ./prometheus/metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      # The Prometheus data source and the Menged dashboard.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  app-data:
  postgres-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
